<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bg512" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#151d45"/>
      <stop offset="100%" stop-color="#060814"/>
    </radialGradient>
    <filter id="glow512" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="512" height="512" rx="110" fill="url(#bg512)"/>
  <rect width="504" height="504" x="4" y="4" rx="106" fill="none" stroke="rgba(0, 243, 255, 0.35)" stroke-width="4"/>

  <!-- Cyber X Mark -->
  <g filter="url(#glow512)">
    <line x1="110" y1="110" x2="310" y2="310" stroke="#00f3ff" stroke-width="36" stroke-linecap="round"/>
    <line x1="310" y1="110" x2="110" y2="310" stroke="#00f3ff" stroke-width="36" stroke-linecap="round"/>
  </g>

  <!-- Cyber O Mark -->
  <g filter="url(#glow512)">
    <circle cx="340" cy="340" r="95" fill="none" stroke="#ff007f" stroke-width="36"/>
  </g>

  <circle cx="210" cy="210" r="10" fill="#ffffff" filter="url(#glow512)"/>
</svg>
