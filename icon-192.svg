<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#12183a"/>
      <stop offset="100%" stop-color="#060814"/>
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="192" height="192" rx="42" fill="url(#bg)"/>
  <rect width="188" height="188" x="2" y="2" rx="40" fill="none" stroke="rgba(0, 243, 255, 0.3)" stroke-width="2"/>

  <!-- Cyber X Mark -->
  <g filter="url(#glow)">
    <line x1="42" y1="42" x2="114" y2="114" stroke="#00f3ff" stroke-width="14" stroke-linecap="round"/>
    <line x1="114" y1="42" x2="42" y2="114" stroke="#00f3ff" stroke-width="14" stroke-linecap="round"/>
  </g>

  <!-- Cyber O Mark -->
  <g filter="url(#glow)">
    <circle cx="126" cy="126" r="36" fill="none" stroke="#ff007f" stroke-width="14"/>
  </g>

  <circle cx="78" cy="78" r="4" fill="#ffffff" filter="url(#glow)"/>
</svg>
